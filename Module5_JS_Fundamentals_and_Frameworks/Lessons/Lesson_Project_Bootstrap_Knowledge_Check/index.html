<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bootstrap Knowledge Check</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">My Site</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container-fluid mt-5 pt-5">

  <!-- Image Section -->
  <div class="text-center">
    <img src="assets/sample.jpg" class="img-fluid" alt="Main image" />
    <img src="assets/sample.jpg" class="rounded-circle mt-3" width="150" height="150" alt="Circular image" />
  </div>

  <!-- Button Section -->
  <div class="text-center mt-4">
    <button class="btn btn-primary">Always Visible</button>
    <button class="btn btn-secondary d-none d-md-block">Hidden on Small Screens</button>
  </div>

  <!-- Registration Form -->
  <div class="container mt-5">
    <h2 class="text-center text-primary">Register</h2>
    <form class="border p-4 shadow bg-light">
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" class="form-control" id="firstName" placeholder="John">
        </div>
        <div class="col-md-6">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" class="form-control" id="lastName" placeholder="Doe">
        </div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control is-invalid" id="email" required>
        <div class="invalid-feedback">Email is required</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control is-invalid" id="password" required>
        <div class="invalid-feedback">Password is required</div>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="terms" required>
        <label class="form-check-label" for="terms">Agree to terms and conditions</label>
      </div>
      <button type="submit" class="btn btn-success w-100">Submit</button>
    </form>
  </div>

  <!-- User Table -->
  <div class="container mt-5">
    <h2 class="text-center text-primary">User Table</h2>
    <div class="table-responsive">
      <table class="table table-striped table-hover border mt-3">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>First Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Jane Doe</td>
            <td>jane@example.com</td>
            <td>Admin</td>
            <td class="text-success">Active</td>
          </tr>
          <tr>
            <td>2</td>
            <td>John Smith</td>
            <td>john@example.com</td>
            <td>User</td>
            <td class="text-muted">Inactive</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
