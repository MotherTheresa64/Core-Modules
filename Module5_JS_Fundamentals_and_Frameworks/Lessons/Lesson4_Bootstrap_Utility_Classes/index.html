<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Utility Classes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Utility Example Container -->
    <div class="container mt-5 p-4 border border-primary">
        <h1 class="text-primary text-center mb-4">Using Bootstrap Utilities</h1>
        <p class="text-center text-danger fw-bold">Utility classes make styling faster and easier.</p>
        <button class="btn btn-success mt-3 px-4 py-2 d-block mx-auto">Styled Button</button>
    </div>

    <!-- Utility-Enhanced Card Layout -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-lg p-3 bg-light border">
                    <h5 class="card-title text-primary">Card One</h5>
                    <p class="card-text">This card has a shadow and padding.</p>
                    <a href="#" class="btn btn-outline-primary d-block mx-auto">Learn More</a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm bg-secondary text-white p-4 border-0">
                    <h5 class="card-title">Card Two</h5>
                    <p class="card-text">This card has a gray background.</p>
                    <a href="#" class="btn btn-outline-light">Learn More</a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 bg-warning border border-danger">
                    <h5 class="card-title">Card Three</h5>
                    <p class="card-text">This card has a yellow background and a red border.</p>
                    <a href="#" class="btn btn-dark">Learn More</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
